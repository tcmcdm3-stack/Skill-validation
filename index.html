<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Validation Room (test)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g:#76D000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#111;background:#fff}
button{font-size:16px;padding:12px 16px;border:0;border-radius:8px;background:var(--g);color:#000;font-weight:bold;cursor:pointer}
button.grey{background:#ddd}button.red{background:#c62828;color:#fff}button:disabled{opacity:.5}
.screen{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;border-left:6px solid var(--g);padding-left:10px}
.link{word-break:break-all;background:#f3f3f3;padding:10px;border-radius:6px;margin:6px 0;font-size:13px}
.err{background:#fde0e0;color:#8a0000;padding:10px;border-radius:6px;margin:10px 0}
#app{display:none;height:100dvh;flex-direction:column;background:#111;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:#000;font-size:14px;flex-wrap:wrap}
.pill{padding:3px 10px;border-radius:12px;background:#555}.pill.ok{background:var(--g);color:#000}.pill.warn{background:#f9a825;color:#000}.pill.bad{background:#c62828}
.main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;background:#000;min-width:0}
#remote{width:100%;height:100%;object-fit:contain;background:#000}
#local{position:absolute;right:10px;bottom:10px;width:26%;max-width:220px;min-width:90px;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--g);border-radius:8px;z-index:2;background:#222}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px;background:rgba(0,0,0,.65);z-index:1}
#note{position:absolute;top:8px;left:8px;right:8px;background:#fff;color:#111;padding:8px;border-radius:6px;display:none;z-index:3}
.panel{width:320px;background:#fff;color:#111;padding:12px;overflow:auto}
.panel.hide{display:none}
.it{border:1px solid #ddd;border-radius:6px;padding:8px;margin:8px 0;font-size:14px}
.it input[type=text]{width:100%;padding:6px;margin:4px 0}
.ctl{display:flex;justify-content:center;gap:8px;padding:10px;background:#000;flex-wrap:wrap}
@media(max-width:800px){.main{flex-direction:column}.panel{width:auto;max-height:38%}}
</style></head><body>

<div id="home" class="screen">
  <h1>Skill Validation - video test</h1>
  <p>Create a test room, open the <b>trainer</b> link on your laptop and the <b>worker</b> link on your phone.</p>
  <button id="mk">Create test room</button>
  <div id="links"></div>
</div>

<div id="join" class="screen" style="display:none">
  <h1>Join validation session</h1>
  <p id="who"></p>
  <video id="prev" autoplay playsinline muted style="width:100%;border-radius:8px;max-height:50vh;background:#000"></video>
  <div id="jerr"></div>
  <button id="joinBtn" disabled>Join Validation Session</button>
</div>

<div id="app">
  <div class="top"><span id="info"></span><span><span id="pill" class="pill">Waiting</span> <span id="path"></span></span><span id="clock">00:00</span></div>
  <div class="main">
    <div class="stage">
      <video id="remote" autoplay playsinline></video>
      <div id="overlay">Connecting...</div>
      <video id="local" autoplay playsinline muted></video>
      <div id="note"></div>
    </div>
    <div id="panel" class="panel"></div>
  </div>
  <div class="ctl">
    <button id="mic">Mic on</button><button id="cam">Camera on</button>
    <button id="sw" class="grey" style="display:none">Switch camera</button>
    <button id="pt" class="grey">Panel</button><button id="end" class="red">End session</button>
  </div>
</div>

<div id="ended" class="screen" style="display:none"><h1>Session ended</h1><p id="endMsg"></p><button onclick="location.reload()">Back</button></div>

<script>
(function(){
// ======== PASTE YOUR VALUES HERE (the anon key is meant to be public) ========
var CFG={
  URL:'https://ncuzmjhfohnuhctnsbdc.supabase.co',
  KEY:'sb_publishable_kGuJhWM-0VV1Z9aknq_ZMg_9jTt9luQ',
  ICE:[{urls:'stun:stun.cloudflare.com:3478'},{urls:'stun:stun.l.google.com:19302'}]
};
// ==============================================================================
var $=function(id){return document.getElementById(id)};
var hp=new URLSearchParams(location.hash.slice(1)), room=hp.get('r'), role=hp.get('role');
var valid=/^[a-f0-9]{32}$/.test(room||'')&&(role==='trainer'||role==='worker');
var other=role==='trainer'?'worker':'trainer';
var stream,pc,channel,facing='user',pending=[],curGen=0,lastOtherT=null,quiz='NOT_STARTED',recT=null,t0=null,joinT=Date.now(),ended=false;

function show(id){['home','join','ended'].forEach(function(x){$(x).style.display=x===id?'block':'none'});$('app').style.display=id==='app'?'flex':'none';}
function note(t){var n=$('note');n.textContent=t;n.style.display='block';setTimeout(function(){n.style.display='none'},4500);}
function setStatus(t,c){var p=$('pill');p.textContent=t;p.className='pill '+(c||'');}
function overlay(t){var o=$('overlay');if(t){o.textContent=t;o.style.display='flex'}else o.style.display='none';}
function hex(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,function(b){return b.toString(16).padStart(2,'0')}).join('');}
function camErr(e){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return 'This page must be opened with https:// to use the camera.';
  var n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'Camera or microphone is blocked. Tap the lock icon near the address bar, allow Camera and Microphone, then reload.';
  if(n==='NotFoundError')return 'No camera or microphone found on this device.';
  if(n==='NotReadableError')return 'The camera is being used by another app. Close other apps and reload.';
  return 'Could not start camera/microphone ('+(n||'unknown')+').';
}

/* ---------- home: make links ---------- */
function makeLinks(){
  var id=hex(),base=location.origin+location.pathname;
  var box=$('links');box.innerHTML='';
  [['Trainer link','trainer'],['Worker link','worker']].forEach(function(x){
    var url=base+'#r='+id+'&role='+x[1];
    var l=document.createElement('div');l.className='link';l.textContent=x[0]+': '+url;box.appendChild(l);
    var b=document.createElement('button');b.className='grey';b.textContent='Copy '+x[1]+' link';
    b.onclick=function(){navigator.clipboard.writeText(url).then(function(){b.textContent='Copied'})};box.appendChild(b);
    var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.textContent='  Open in new tab';box.appendChild(a);
  });
}

/* ---------- join screen ---------- */
async function startPreview(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
    $('prev').srcObject=stream;$('joinBtn').disabled=false;
    navigator.mediaDevices.enumerateDevices().then(function(d){if(d.filter(function(x){return x.kind==='videoinput'}).length>1)$('sw').style.display='';});
  }catch(e){$('jerr').innerHTML='';var d=document.createElement('div');d.className='err';d.textContent=camErr(e);$('jerr').appendChild(d);}
}
function failScreen(m){setStatus('Failed','bad');overlay(m);}

async function joinRoom(){
  if(!CFG.URL||CFG.URL.indexOf('PASTE')===0||CFG.KEY.indexOf('PASTE')===0){alert('The Supabase URL and key have not been pasted into the file yet.');return;}
  show('app');$('local').srcObject=stream;$('remote').srcObject=null;
  $('info').textContent=(role==='trainer'?'Trainer':'Worker')+' - Room '+room.slice(0,8);
  setupPanel();setStatus('Connecting','warn');overlay('Connecting to the session service...');
  var sb=window.supabase.createClient(CFG.URL,CFG.KEY);
  channel=sb.channel('room-'+room,{config:{broadcast:{self:false},presence:{key:role}}});
  channel.on('broadcast',{event:'sig'},function(m){onSig(m.payload)})
         .on('presence',{event:'sync'},onSync)
         .subscribe(async function(st){
    if(st==='SUBSCRIBED'){await channel.track({t:joinT});setStatus('Waiting');overlay('Waiting for the '+other+' to join...');}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){failScreen('Could not reach the session service. Check your internet, then reload this page.');}
  });
  setInterval(function(){if(t0){var s=Math.floor((Date.now()-t0)/1000);$('clock').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2);}},1000);
}
function send(p){try{if(channel)channel.send({type:'broadcast',event:'sig',payload:p});}catch(e){}}

function onSync(){
  if(ended)return;
  var st=channel.presenceState();
  var mine=st[role]||[];
  if(mine.some(function(m){return m.t<joinT})){endLocal('This session already has a '+role+' connected. Only one '+role+' is allowed.');return;}
  var o=(st[other]||[]).slice().sort(function(a,b){return a.t-b.t})[0];
  if(!o){lastOtherT=null;setStatus('Waiting');overlay('Waiting for the '+other+' to join...');return;}
  if(role==='trainer'&&o.t!==lastOtherT){lastOtherT=o.t;startOffer();}
}

/* ---------- WebRTC ---------- */
function newPC(){
  if(pc){pc.onicecandidate=pc.ontrack=pc.onconnectionstatechange=null;pc.close();}
  pending=[];pc=new RTCPeerConnection({iceServers:CFG.ICE});
  stream.getTracks().forEach(function(t){pc.addTrack(t,stream)});
  pc.onicecandidate=function(e){if(e.candidate)send({k:'ice',gen:curGen,c:e.candidate});};
  pc.ontrack=function(e){$('remote').srcObject=e.streams[0];};
  pc.onconnectionstatechange=onConn;
}
async function startOffer(){
  if(role!=='trainer'||!stream||ended)return;
  curGen=Date.now();newPC();setStatus('Connecting','warn');overlay('Connecting...');
  var o=await pc.createOffer();await pc.setLocalDescription(o);
  send({k:'offer',gen:curGen,d:pc.localDescription,quiz:quiz});
}
async function flush(){while(pending.length){await pc.addIceCandidate(pending.shift()).catch(function(){});}}
async function onSig(p){
  if(ended)return;
  try{
    if(p.k==='offer'&&role==='worker'){
      curGen=p.gen;newPC();if(p.quiz)setQuiz(p.quiz);
      setStatus('Connecting','warn');overlay('Connecting...');
      await pc.setRemoteDescription(p.d);await flush();
      var a=await pc.createAnswer();await pc.setLocalDescription(a);
      send({k:'answer',gen:curGen,d:pc.localDescription});
    }else if(p.k==='answer'&&role==='trainer'){
      if(p.gen===curGen&&pc&&pc.signalingState==='have-local-offer'){await pc.setRemoteDescription(p.d);await flush();}
    }else if(p.k==='ice'){
      if(p.gen!==curGen||!pc)return;
      if(pc.remoteDescription)await pc.addIceCandidate(p.c).catch(function(){});else pending.push(p.c);
    }else if(p.k==='restart'){if(role==='trainer')startOffer();}
    else if(p.k==='quiz'){onQuiz(p.s);}
    else if(p.k==='end'){endLocal('The other person ended the session.');}
  }catch(e){note('Connection setup problem: '+(e.message||e));}
}
function onConn(){
  if(!pc)return;var s=pc.connectionState;
  if(s==='connected'){
    clearTimeout(recT);setStatus('Connected','ok');overlay(null);if(!t0)t0=Date.now();
    pathType().then(function(p){$('path').textContent=p?'('+p+')':''});
  }else if(s==='connecting'||s==='new'){setStatus('Connecting','warn');}
  else if(s==='disconnected'||s==='failed'){
    setStatus('Reconnecting','warn');overlay('Connection lost - reconnecting...');
    clearTimeout(recT);recT=setTimeout(recover,s==='failed'?500:6000);
  }
}
function recover(){
  if(ended||!pc||pc.connectionState==='connected')return;
  if(role==='trainer')startOffer();else send({k:'restart'});
  clearTimeout(recT);
  recT=setTimeout(function(){if(!ended&&pc&&pc.connectionState!=='connected')failScreen('Connection failed. Check the internet on both devices, then reload this page.');},20000);
}
async function pathType(){
  try{
    var stats=await pc.getStats(),sel=null;
    stats.forEach(function(r){if(r.type==='transport'&&r.selectedCandidatePairId)sel=stats.get(r.selectedCandidatePairId);});
    if(!sel)stats.forEach(function(r){if(r.type==='candidate-pair'&&r.nominated&&r.state==='succeeded')sel=r;});
    if(!sel)return '';
    var l=stats.get(sel.localCandidateId),r2=stats.get(sel.remoteCandidateId);
    return ((l&&l.candidateType==='relay')||(r2&&r2.candidateType==='relay'))?'relay':'direct';
  }catch(e){return '';}
}

/* ---------- quiz handshake (demo only) ---------- */
var QL={NOT_STARTED:'Not started',READY:'Ready',IN_PROGRESS:'In progress',SUBMITTED:'Submitted'};
function setQuiz(s){quiz=s;if(role==='trainer'){$('qs').textContent=QL[s];}else renderWorkerQuiz();}
function onQuiz(s){
  if(role==='trainer'&&(s==='IN_PROGRESS'||s==='SUBMITTED'))setQuiz(s);
  if(role==='worker'&&(s==='READY'||s==='NOT_STARTED'))setQuiz(s);
}
function renderWorkerQuiz(){
  var el=$('wq');if(!el)return;
  if(quiz==='NOT_STARTED')el.innerHTML='<p>Waiting for your trainer to open the quiz.</p>';
  else if(quiz==='READY'){
    el.innerHTML='<p><b>Quiz Ready - Click Start to Begin</b></p><button id="wStart">Start Quiz</button>';
    $('wStart').onclick=function(){setQuiz('IN_PROGRESS');send({k:'quiz',s:'IN_PROGRESS'});};
  }else if(quiz==='IN_PROGRESS'){
    el.innerHTML='<p>Quiz in progress (demo screen - real questions come later).</p><button id="wSub">Submit (demo)</button>';
    $('wSub').onclick=function(){setQuiz('SUBMITTED');send({k:'quiz',s:'SUBMITTED'});};
  }else el.innerHTML='<p>Quiz submitted. Thank you.</p>';
}
function setupPanel(){
  var p=$('panel');
  if(role==='trainer'){
    p.innerHTML='<h3>Assessment panel</h3><p>Quiz status: <b id="qs">Not started</b></p>'+
      '<button id="qBtn">Start Quiz (make available)</button>'+
      '<h4>Practical checklist (layout preview, not saved)</h4>'+
      ['Sample skill item 1','Sample skill item 2'].map(function(t,i){return '<div class="it"><b>'+(i+1)+'. '+t+'</b><br>'+
        '<label><input type="radio" name="i'+i+'"> Satisfactory</label> <label><input type="radio" name="i'+i+'"> Unsatisfactory</label> <label><input type="radio" name="i'+i+'"> N/A</label>'+
        '<input type="text" placeholder="Observation"><label><input type="checkbox"> Critical safety failure</label></div>'}).join('');
    $('qBtn').onclick=function(){if(quiz!=='NOT_STARTED')return;setQuiz('READY');send({k:'quiz',s:'READY'});$('qBtn').disabled=true;};
  }else{p.innerHTML='<h3>Quiz</h3><div id="wq"></div>';renderWorkerQuiz();}
}

/* ---------- controls ---------- */
$('mic').onclick=function(){var t=stream.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$('mic').textContent=t.enabled?'Mic on':'Mic off';$('mic').className=t.enabled?'':'red';};
$('cam').onclick=function(){var t=stream.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$('cam').textContent=t.enabled?'Camera on':'Camera off';$('cam').className=t.enabled?'':'red';};
$('pt').onclick=function(){$('panel').classList.toggle('hide');};
$('sw').onclick=async function(){
  var prev=facing;facing=facing==='user'?'environment':'user';
  try{
    var ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}});
    var nt=ns.getVideoTracks()[0],old=stream.getVideoTracks()[0];
    if(pc){var s=pc.getSenders().find(function(x){return x.track&&x.track.kind==='video'});if(s)await s.replaceTrack(nt);}
    stream.removeTrack(old);old.stop();stream.addTrack(nt);$('local').srcObject=stream;
  }catch(e){facing=prev;note('Could not switch the camera.');}
};
$('end').onclick=function(){if(!confirm('End this session?'))return;send({k:'end'});setTimeout(function(){endLocal('You ended the session.')},300);};
function endLocal(m){
  ended=true;clearTimeout(recT);
  if(pc)pc.close();if(stream)stream.getTracks().forEach(function(t){t.stop()});
  try{channel.unsubscribe()}catch(e){}
  $('endMsg').textContent=m;show('ended');
}

/* ---------- start ---------- */
if(!valid){show('home');$('mk').onclick=makeLinks;}
else{
  $('who').textContent='You are joining as the '+role+'. Allow the camera and microphone when your browser asks.';
  show('join');startPreview();$('joinBtn').onclick=joinRoom;
}
})();
</script></body></html>
